name = "ai-report-studio"
main = "src/index.ts"
compatibility_date = "2025-10-19"

# Enable Node.js compatibility mode and enable HTTP/HTTPS native modules
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_http_modules",
  "enable_nodejs_http_server_modules"
]

workers_dev = true
preview_urls = true
